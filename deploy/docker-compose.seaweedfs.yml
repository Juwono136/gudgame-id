# SeaweedFS object storage + nginx basic-auth gateway (port 8333 on localhost)
# Run from repo: docker compose -f deploy/docker-compose.seaweedfs.yml up -d

services:
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-master
    restart: unless-stopped
    command: "master -ip=seaweed-master -mdir=/data -defaultReplication=000"
    volumes:
      - seaweed-master:/data
    networks:
      - seaweed-net

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-volume
    restart: unless-stopped
    command: "volume -mserver=seaweed-master:9333 -port=8080 -dir=/data -max=100"
    depends_on:
      - seaweed-master
    volumes:
      - seaweed-volume:/data
    networks:
      - seaweed-net

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-filer
    restart: unless-stopped
    command: "filer -master=seaweed-master:9333 -defaultReplicaPlacement=000"
    depends_on:
      - seaweed-master
      - seaweed-volume
    volumes:
      - seaweed-filer:/data
    networks:
      - seaweed-net

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed-s3
    restart: unless-stopped
    command: "s3 -filer=seaweed-filer:8888 -port=8333"
    depends_on:
      - seaweed-filer
    networks:
      - seaweed-net

  seaweed-nginx:
    image: nginx:1.27-alpine
    container_name: seaweed-nginx
    restart: unless-stopped
    depends_on:
      - seaweed-s3
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./nginx/seaweed-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - seaweed-net

volumes:
  seaweed-master:
  seaweed-volume:
  seaweed-filer:

networks:
  seaweed-net:
    driver: bridge
