# Gud Game — full VPS stack on Docker network `tunnel`.
# Cloudflare Tunnel / Zero Trust is configured separately (cloudflared joins `tunnel`).
#
# First boot on empty VPS:
#   docker network create tunnel
#   USERNAME_STORAGE=… PASSWORD_STORAGE=… ./ops/storage/generate-htpasswd.sh
#   docker compose up -d
#
# Never run `docker compose down --remove-orphans` globally on a shared VPS.
name: gudgame-app

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    # Dump `gudgame_db-backup` was taken from PostgreSQL 18.6 — server must be ≥ 18.
    image: postgres:18-alpine
    container_name: gudgame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME:-zaka_user}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:-gudgame_db}
    volumes:
      # PG18+ official image: mount /var/lib/postgresql (NOT .../data).
      # PGDATA inside the image is /var/lib/postgresql/18/docker.
      # New volume name also avoids "incompatible data directory" from PG16.
      - gudgame_postgres18_data:/var/lib/postgresql
    ports:
      # Localhost-only for emergency admin; app uses hostname `postgres` on `tunnel`
      - "127.0.0.1:5432:5432"
    networks:
      - tunnel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d postgres",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: gudgame-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
      - --appendonly
      - "yes"
    volumes:
      - gudgame_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - tunnel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gudgame-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gudgame.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - gudgame_pgadmin_data:/var/lib/pgadmin
      - ./ops/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Optional: place gudgame.dump here for UI Restore → Filename `/backups/gudgame.dump`
      - ./ops/db/backups:/backups:ro
    ports:
      # Localhost-only; expose via Cloudflare Tunnel if needed
      - "127.0.0.1:5050:80"
    networks:
      - tunnel
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Object storage (SeaweedFS) + nginx security gateway
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_core
    restart: unless-stopped
    command: >-
      server -dir=/data -volume.max=10
      -master.port=9333 -volume.port=8080
      -filer=true -filer.port=8333
    volumes:
      - seaweed_master_data:/data
    networks:
      - tunnel
    # No host ports — only reachable via storage_gateway / Docker DNS
    # Image is minimal; rely on storage_gateway + app retries rather than a fragile probe.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  storage_gateway:
    image: nginx:alpine
    container_name: storage_gateway
    restart: unless-stopped
    ports:
      # Lock so host/tunnel agents can reach storage only via localhost or Docker DNS
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - ./ops/storage/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/storage/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - tunnel
    depends_on:
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/gudgame:latest
    container_name: gudgame-app
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage_gateway:
        condition: service_started
    environment:
      # Main
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://gudgame.id}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gudgame.id}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STRICT_PRODUCTION_ENV: ${STRICT_PRODUCTION_ENV:-true}

      # Database & cache — Docker DNS hostnames on network `tunnel`
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      REDIS_URL: ${REDIS_URL:-}

      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://gudgame.id}
      AUTH_LOCKOUT_ENABLED: ${AUTH_LOCKOUT_ENABLED:-true}

      # Firebase (server)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}

      # Firebase (client — also baked at build; keep for SSR consistency)
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}

      # SeaweedFS via nginx gateway (service name `storage_gateway`)
      STORAGE_ALLOW_LOCALHOST: ${STORAGE_ALLOW_LOCALHOST:-true}
      STORAGE_AUTH_MODE: ${STORAGE_AUTH_MODE:-nginx-basic}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage_gateway:8333}
      NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://storage.gudgame.id}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-gudgame}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      USERNAME_STORAGE: ${USERNAME_STORAGE:-}
      PASSWORD_STORAGE: ${PASSWORD_STORAGE:-}

      # Xendit
      XENDIT_STAGING_MODE: ${XENDIT_STAGING_MODE:-true}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}
      XENDIT_XENPLATFORM_ENABLED: ${XENDIT_XENPLATFORM_ENABLED:-true}

      # Google Maps Places API (New) + optional Embed API
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_EMBED_API_ENABLED: ${GOOGLE_MAPS_EMBED_API_ENABLED:-false}

      # Ops
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WIKI_SCRAPE_ALLOWED_HOSTS: ${WIKI_SCRAPE_ALLOWED_HOSTS:-}

    ports:
      - "3000:3000"
    networks:
      - tunnel
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "X-Health-Token: $${HEALTH_CHECK_TOKEN}" http://127.0.0.1:3000/api/health | grep -q "status" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Sidecar: scheduled jobs (host payouts + timed match finalize).
  # See ops/cron/host-payouts.crontab — HTTP /api/cron/* with CRON_SECRET.
  payout-cron:
    build:
      context: ./ops/cron
      dockerfile: Dockerfile
    image: gudgame-payout-cron:local
    container_name: gudgame-payout-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      APP_INTERNAL_URL: http://app:3000
      TZ: Asia/Jakarta
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off: apply SQL migrations via scripts/run-db-migrate.ts (NOT drizzle-kit push).
  # Push hides failures in CI; migrate:prod validates connectivity and applies db/migrations.
  # docker compose --profile migrate run --rm db-migrate
  db-migrate:
    profiles: ["migrate"]
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SCRIPT_MODE: ${DB_SCRIPT_MODE:-true}
      NODE_ENV: ${NODE_ENV:-production}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage_gateway:8333}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-gudgame}
      STORAGE_AUTH_MODE: ${STORAGE_AUTH_MODE:-nginx-basic}
      USERNAME_STORAGE: ${USERNAME_STORAGE:-}
      PASSWORD_STORAGE: ${PASSWORD_STORAGE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      DEPLOY_QA_FIXTURE_PURGE: ${DEPLOY_QA_FIXTURE_PURGE:-}
    networks:
      - tunnel
    command: ["npm", "run", "db:migrate:prod"]

  # One-off: restore PostgreSQL custom dump (PGDMP) into gudgame_db.
  # Dump may be named tanding_db internally — restored WITHOUT --create into gudgame_db.
  # Never run on every push — opt-in only:
  #   cp ~/gudgame_db-backup ops/db/backups/gudgame.dump
  #   FORCE_RESTORE=true docker compose --profile restore run --rm db-restore
  #   docker compose --profile migrate run --rm db-migrate
  db-restore:
    profiles: ["restore"]
    image: postgres:18-alpine
    container_name: gudgame-db-restore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRESQL_USERNAME:-zaka_user}
      PGPASSWORD: ${POSTGRESQL_PASSWORD:-changeme}
      PGDATABASE: ${POSTGRESQL_DATABASE:-gudgame_db}
      FORCE_RESTORE: ${FORCE_RESTORE:-false}
      SKIP_RESTORE_IF_DATA: ${SKIP_RESTORE_IF_DATA:-true}
      RESTORE_DUMP_PATH: /backup/gudgame.dump
    volumes:
      - ${GUDGAME_RESTORE_DUMP:-./ops/db/backups/gudgame.dump}:/backup/gudgame.dump:ro
      - ./ops/db/restore-from-dump.sh:/restore.sh:ro
    networks:
      - tunnel
    entrypoint: ["/bin/sh", "/restore.sh"]

networks:
  tunnel:
    name: tunnel
    external: true

volumes:
  gudgame_postgres18_data:
  gudgame_redis_data:
  gudgame_pgadmin_data:
  seaweed_master_data:
