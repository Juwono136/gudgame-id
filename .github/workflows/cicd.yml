name: Gud Game CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
  workflow_dispatch:
    inputs:
      wipe_postgres_volume:
        description: "Wipe Postgres Docker volume (required once for PG16→18 upgrade when DB is empty)"
        type: boolean
        default: false
      restore_db_dump:
        description: "Restore ops/db/backups/gudgame.dump into gudgame_db before migrate"
        type: boolean
        default: false
      force_restore:
        description: "Drop+recreate gudgame_db before restore (used with restore_db_dump)"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gudgame:latest
          cache-from: type=gha,scope=gudgame-deps
          cache-to: type=gha,mode=max,scope=gudgame-deps
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest app image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/gudgame:latest

      - name: Ensure Docker network `tunnel` exists
        env:
          TUNNEL_NAME: ${{ secrets.TUNNEL_NAME }}
        run: |
          NET="${TUNNEL_NAME:-tunnel}"
          docker network inspect "${NET}" >/dev/null 2>&1 || docker network create "${NET}"
          echo "Using Docker network: ${NET}"

      - name: Generate SeaweedFS nginx htpasswd
        env:
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}
        run: |
          chmod +x ops/storage/generate-htpasswd.sh
          ./ops/storage/generate-htpasswd.sh

      # Build canonical URLs BEFORE starting Postgres so POSTGRES_DB=gudgame_db
      - name: Resolve Docker DATABASE_URL (postgres + gudgame_db)
        env:
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ops/ci/export-docker-database-url.sh
          export POSTGRESQL_DATABASE="${POSTGRESQL_DATABASE:-gudgame_db}"
          . ops/ci/export-docker-database-url.sh

      # Postgres 18 cannot reuse a PG16 data volume — detect + optional wipe.
      - name: Start Postgres (handle PG major upgrade)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          # workflow_dispatch input OR one-shot GitHub secret (set true once, then remove)
          POSTGRES_WIPE_ON_MAJOR_UPGRADE: ${{ inputs.wipe_postgres_volume || secrets.POSTGRES_WIPE_ON_MAJOR_UPGRADE || 'false' }}
          POSTGRES_EXPECTED_MAJOR: "18"
        run: |
          set -euo pipefail
          chmod +x ops/ci/ensure-postgres-ready.sh
          # Normalize boolean-ish values from Actions
          case "${POSTGRES_WIPE_ON_MAJOR_UPGRADE}" in
            true|TRUE|True|1|yes|YES) export POSTGRES_WIPE_ON_MAJOR_UPGRADE=true ;;
            *) export POSTGRES_WIPE_ON_MAJOR_UPGRADE=false ;;
          esac
          ./ops/ci/ensure-postgres-ready.sh

      - name: Start remaining infra (redis, seaweedfs, storage_gateway, pgadmin)
        run: |
          docker compose up -d redis seaweedfs storage_gateway pgadmin
          docker compose up -d --wait --wait-timeout 120 redis
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}

      - name: Ensure Postgres database gudgame_db exists
        env:
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
        run: |
          set -euo pipefail
          DB_NAME="${POSTGRESQL_DATABASE:-gudgame_db}"
          echo "Ensuring database '${DB_NAME}' exists on gudgame-postgres…"
          EXISTS="$(docker compose exec -T -e PGPASSWORD="${POSTGRESQL_PASSWORD}" postgres \
            psql -U "${POSTGRESQL_USERNAME}" -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" | tr -d '[:space:]')"
          if [ "${EXISTS}" = "1" ]; then
            echo "Database '${DB_NAME}' already exists."
          else
            docker compose exec -T -e PGPASSWORD="${POSTGRESQL_PASSWORD}" postgres \
              psql -U "${POSTGRESQL_USERNAME}" -d postgres -v ON_ERROR_STOP=1 -c \
              "CREATE DATABASE \"${DB_NAME}\";"
            echo "Created database '${DB_NAME}'."
          fi

      # Optional: restore custom dump (tanding_db → gudgame_db). Same pipeline as deploy.
      - name: Restore database dump (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_db_dump }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          FORCE_RESTORE: ${{ inputs.force_restore }}
          SKIP_RESTORE_IF_DATA: "false"
          GUDGAME_RESTORE_DUMP: ${{ secrets.GUDGAME_RESTORE_DUMP }}
        run: |
          set -euo pipefail
          chmod +x ops/db/restore-from-dump.sh
          DUMP="${GUDGAME_RESTORE_DUMP:-}"
          if [ -z "${DUMP}" ] || [ ! -f "${DUMP}" ]; then
            DUMP="$(pwd)/ops/db/backups/gudgame.dump"
          fi
          if [ ! -f "${DUMP}" ]; then
            echo "Dump not found at ${DUMP}" >&2
            echo "Copy gudgame_db-backup to ops/db/backups/gudgame.dump on the VPS runner." >&2
            exit 1
          fi
          export GUDGAME_RESTORE_DUMP="${DUMP}"
          case "${FORCE_RESTORE}" in
            true|TRUE|True|1) export FORCE_RESTORE=true ;;
            *) export FORCE_RESTORE=false ;;
          esac
          docker compose --profile restore run --rm db-restore

      - name: Build DB migration image
        run: docker compose --profile migrate build --pull db-migrate
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Run DB migration
        run: |
          set -euo pipefail
          echo "Migrating with npm run db:migrate:prod"
          MASKED="$(printf '%s' "${DATABASE_URL}" | sed -E 's#://[^/@]+@#://***:***@#')"
          echo "DATABASE_URL (masked): ${MASKED}"
          case "${DATABASE_URL}" in
            *host.docker.internal*|*tanding_db*|*'@localhost'*|*'@127.0.0.1'*)
              echo "Refusing legacy DATABASE_URL (host.docker.internal / tanding_db / localhost)" >&2
              exit 1
              ;;
          esac
          docker compose --profile migrate run --rm \
            -e DB_SCRIPT_MODE=true \
            -e DATABASE_URL \
            db-migrate
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_SCRIPT_MODE: "true"
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}

      - name: Seed database (sports & defaults, idempotent)
        run: docker compose --profile migrate run --rm -e DATABASE_URL db-migrate npm run db:seed
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_AUTH_MODE: ${{ secrets.STORAGE_AUTH_MODE }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}

      - name: Bootstrap super admin user (no email)
        run: |
          docker compose --profile migrate build db-migrate
          docker compose --profile migrate run --rm -e DATABASE_URL -e DB_SCRIPT_MODE=true \
            db-migrate npm run db:bootstrap-admin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_SCRIPT_MODE: "true"
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}

      # Never recreate dummy tournaments or test players on production.
      - name: Purge Official FREE QA fixtures
        run: |
          set -euo pipefail
          echo "Purging dummy Official FREE QA fixtures and seed-domain players"
          docker compose --profile migrate run --rm \
            -e DEPLOY_QA_FIXTURE_PURGE=true \
            -e DB_SCRIPT_MODE=true \
            -e DATABASE_URL \
            db-migrate npm run db:seed:fixtures:purge -- --players
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_SCRIPT_MODE: "true"
          NODE_ENV: ${{ secrets.NODE_ENV }}
          DEPLOY_QA_FIXTURE_PURGE: "true"
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}

      # Recreate app + payout scheduler only — infra stays up (--no-deps).
      - name: Deploy Gud Game app
        run: |
          docker compose pull app
          docker compose build payout-cron
          docker compose up -d --no-deps app
          docker compose up -d --wait --wait-timeout 120 --no-deps payout-cron
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

          # Main
          NODE_ENV: ${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          STRICT_PRODUCTION_ENV: ${{ secrets.STRICT_PRODUCTION_ENV }}

          # Database & cache — from Resolve step (GITHUB_ENV), NOT stale secrets.DATABASE_URL
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

          # Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          AUTH_LOCKOUT_ENABLED: ${{ secrets.AUTH_LOCKOUT_ENABLED }}

          # Firebase (server)
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

          # Firebase (client)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

          # Email
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

          # SeaweedFS via storage_gateway
          STORAGE_ALLOW_LOCALHOST: ${{ secrets.STORAGE_ALLOW_LOCALHOST }}
          STORAGE_AUTH_MODE: ${{ secrets.STORAGE_AUTH_MODE }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          NEXT_PUBLIC_STORAGE_URL: ${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}

          # Xendit
          XENDIT_STAGING_MODE: ${{ secrets.XENDIT_STAGING_MODE }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          XENDIT_XENPLATFORM_ENABLED: ${{ secrets.XENDIT_XENPLATFORM_ENABLED }}

          # Google Maps
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_EMBED_API_ENABLED: ${{ secrets.GOOGLE_MAPS_EMBED_API_ENABLED }}

          # Ops
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WIKI_SCRAPE_ALLOWED_HOSTS: ${{ secrets.WIKI_SCRAPE_ALLOWED_HOSTS }}

          # Infra (compose interpolation for sibling services)
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}

      - name: Smoke test health endpoint
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          sleep 12
          set +e
          HTTP_CODE="$(curl -sS -o /tmp/gudgame-health.json -w '%{http_code}' \
            -H "X-Health-Token: ${HEALTH_CHECK_TOKEN}" \
            "http://127.0.0.1:3000/api/health")"
          echo "Health HTTP status: ${HTTP_CODE}"
          cat /tmp/gudgame-health.json | jq . 2>/dev/null || cat /tmp/gudgame-health.json
          if [ "${HTTP_CODE}" = "500" ] || [ "${HTTP_CODE}" = "000" ]; then
            echo "--- gudgame-app logs (last 80 lines) ---"
            docker logs gudgame-app --tail 80 2>&1 || true
          fi
          set -e
          test "${HTTP_CODE}" = "200" -o "${HTTP_CODE}" = "207" -o "${HTTP_CODE}" = "503"
          jq -e '.status == "healthy" or .status == "degraded"' /tmp/gudgame-health.json

      - name: Verify payout cron sidecar
        run: |
          docker compose ps payout-cron
          STATUS="$(docker inspect -f '{{.State.Status}}' gudgame-payout-cron 2>/dev/null || echo missing)"
          HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gudgame-payout-cron 2>/dev/null || echo missing)"
          echo "payout-cron status=${STATUS} health=${HEALTH}"
          if [ "${STATUS}" != "running" ]; then
            docker logs gudgame-payout-cron --tail 50 2>&1 || true
            exit 1
          fi
          if [ "${HEALTH}" = "unhealthy" ]; then
            docker logs gudgame-payout-cron --tail 50 2>&1 || true
            exit 1
          fi
          echo "payout-cron is running"

      - name: Verify infra containers
        run: |
          for c in gudgame-postgres gudgame-redis seaweed_core storage_gateway gudgame-pgadmin gudgame-app; do
            STATUS="$(docker inspect -f '{{.State.Status}}' "${c}" 2>/dev/null || echo missing)"
            echo "${c}: ${STATUS}"
            test "${STATUS}" = "running"
          done

      - name: Cleanup dangling images
        run: docker image prune -f
