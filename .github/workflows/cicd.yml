name: Gud Game CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gudgame:latest
          cache-from: type=gha,scope=gudgame-deps
          cache-to: type=gha,mode=max,scope=gudgame-deps
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/gudgame:latest

      - name: Ensure Docker network exists
        env:
          TUNNEL_NAME: ${{ secrets.TUNNEL_NAME }}
        run: |
          NET="${TUNNEL_NAME:-tunnel}"
          docker network inspect "${NET}" >/dev/null 2>&1 || docker network create "${NET}"

      - name: Build DB migration image
        run: docker compose --profile migrate build --pull db-migrate

      - name: Run DB migration
        run: docker compose --profile migrate run --rm db-migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Seed database (sports & defaults, idempotent)
        run: docker compose --profile migrate run --rm db-migrate npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          # Storage only needed when inserting new sport rows (first deploy)
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_AUTH_MODE: ${{ secrets.STORAGE_AUTH_MODE }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}

      - name: Bootstrap super admin user (no email)
        run: |
          docker compose --profile migrate build db-migrate
          docker compose --profile migrate run --rm db-migrate npm run db:bootstrap-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_SCRIPT_MODE: "true"
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}

      # Idempotent QA fixtures: create only if missing. Never --reset / purge.
      # Skips safely when host account is absent (deploy still succeeds).
      - name: Ensure QA tournament fixtures (idempotent)
        run: |
          set -euo pipefail
          HOST_EMAIL="${SEED_FIXTURE_HOST_EMAIL:-juwonoindonesia@gmail.com}"
          echo "Ensuring fixtures for host=${HOST_EMAIL} (create-if-missing only)"

          docker compose --profile migrate run --rm db-migrate \
            npm run db:seed:double-stage -- \
            --ensure --tier=gold --name "${HOST_EMAIL}"

          docker compose --profile migrate run --rm db-migrate \
            npm run db:seed:fixtures -- \
            --ensure --name "${HOST_EMAIL}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DB_SCRIPT_MODE: "true"
          NODE_ENV: ${{ secrets.NODE_ENV }}
          ALLOW_DEPLOY_FIXTURE_SEED: "true"
          # Optional override; defaults to juwonoindonesia@gmail.com in the step script
          SEED_FIXTURE_HOST_EMAIL: ${{ secrets.SEED_FIXTURE_HOST_EMAIL }}
          SEED_DOUBLE_STAGE_PASSWORD: ${{ secrets.SEED_DOUBLE_STAGE_PASSWORD }}
          SEED_FIXTURE_PASSWORD: ${{ secrets.SEED_FIXTURE_PASSWORD }}

      # Only recreate app + payout scheduler — never `docker compose down --remove-orphans`.
      - name: Deploy Gud Game app
        run: |
          docker compose pull app
          docker compose build payout-cron
          docker compose up -d --no-deps app
          docker compose up -d --wait --wait-timeout 120 --no-deps payout-cron
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

          # Main
          NODE_ENV: ${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          STRICT_PRODUCTION_ENV: ${{ secrets.STRICT_PRODUCTION_ENV }}

          # Database & cache
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

          # Auth
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          AUTH_LOCKOUT_ENABLED: ${{ secrets.AUTH_LOCKOUT_ENABLED }}

          # Firebase (server)
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

          # Firebase (client)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

          # Email
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

          # SeaweedFS
          STORAGE_ALLOW_LOCALHOST: ${{ secrets.STORAGE_ALLOW_LOCALHOST }}
          STORAGE_AUTH_MODE: ${{ secrets.STORAGE_AUTH_MODE }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          NEXT_PUBLIC_STORAGE_URL: ${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}

          # Xendit
          XENDIT_STAGING_MODE: ${{ secrets.XENDIT_STAGING_MODE }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          XENDIT_XENPLATFORM_ENABLED: ${{ secrets.XENDIT_XENPLATFORM_ENABLED }}

          # Google Maps Places API (New) + optional Embed API
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_EMBED_API_ENABLED: ${{ secrets.GOOGLE_MAPS_EMBED_API_ENABLED }}

          # Ops
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WIKI_SCRAPE_ALLOWED_HOSTS: ${{ secrets.WIKI_SCRAPE_ALLOWED_HOSTS }}

      - name: Smoke test health endpoint
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          sleep 12
          set +e
          HTTP_CODE="$(curl -sS -o /tmp/gudgame-health.json -w '%{http_code}' \
            -H "X-Health-Token: ${HEALTH_CHECK_TOKEN}" \
            "http://127.0.0.1:3000/api/health")"
          echo "Health HTTP status: ${HTTP_CODE}"
          cat /tmp/gudgame-health.json | jq . 2>/dev/null || cat /tmp/gudgame-health.json
          if [ "${HTTP_CODE}" = "500" ] || [ "${HTTP_CODE}" = "000" ]; then
            echo "--- gudgame-app logs (last 80 lines) ---"
            docker logs gudgame-app --tail 80 2>&1 || true
          fi
          set -e
          test "${HTTP_CODE}" = "200" -o "${HTTP_CODE}" = "207" -o "${HTTP_CODE}" = "503"
          jq -e '.status == "healthy" or .status == "degraded"' /tmp/gudgame-health.json

      - name: Verify payout cron sidecar
        run: |
          docker compose ps payout-cron
          STATUS="$(docker inspect -f '{{.State.Status}}' gudgame-payout-cron 2>/dev/null || echo missing)"
          HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gudgame-payout-cron 2>/dev/null || echo missing)"
          echo "payout-cron status=${STATUS} health=${HEALTH}"
          if [ "${STATUS}" != "running" ]; then
            docker logs gudgame-payout-cron --tail 50 2>&1 || true
            exit 1
          fi
          if [ "${HEALTH}" = "unhealthy" ]; then
            docker logs gudgame-payout-cron --tail 50 2>&1 || true
            exit 1
          fi
          echo "payout-cron is running"

      - name: Cleanup dangling images
        run: docker image prune -f
