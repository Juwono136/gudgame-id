name: Gud Game DB Restore

# One-shot restore of a PostgreSQL custom dump into gudgame_db.
# Does NOT run on push — only workflow_dispatch (safe for production).
#
# Before running: copy dump to the self-hosted runner checkout:
#   ops/db/backups/gudgame.dump
# (see docs/DATABASE-RESTORE.md)

on:
  workflow_dispatch:
    inputs:
      force_restore:
        description: "Drop and recreate gudgame_db before restore"
        type: boolean
        default: true
      run_migrate_after:
        description: "Run db:migrate:prod after restore"
        type: boolean
        default: true
      skip_if_data:
        description: "Abort if public.user already exists (ignored when force_restore)"
        type: boolean
        default: true

jobs:
  restore:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Docker network `tunnel` exists
        env:
          TUNNEL_NAME: ${{ secrets.TUNNEL_NAME }}
        run: |
          NET="${TUNNEL_NAME:-tunnel}"
          docker network inspect "${NET}" >/dev/null 2>&1 || docker network create "${NET}"

      - name: Resolve Docker DATABASE_URL
        env:
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ops/ci/export-docker-database-url.sh
          export POSTGRESQL_DATABASE="${POSTGRESQL_DATABASE:-gudgame_db}"
          . ops/ci/export-docker-database-url.sh

      - name: Start Postgres 18
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
        run: |
          docker compose up -d postgres
          docker compose up -d --wait --wait-timeout 180 postgres
          docker compose exec -T postgres psql -U "${POSTGRESQL_USERNAME}" -d postgres -c "SHOW server_version;"

      - name: Verify dump file on runner
        run: |
          set -euo pipefail
          DUMP="${GUDGAME_RESTORE_DUMP:-ops/db/backups/gudgame.dump}"
          if [ ! -f "${DUMP}" ]; then
            echo "Missing dump at ${DUMP}" >&2
            echo "Copy gudgame_db-backup to ops/db/backups/gudgame.dump on the VPS runner." >&2
            exit 1
          fi
          MAGIC="$(dd if="${DUMP}" bs=5 count=1 2>/dev/null || true)"
          if [ "${MAGIC}" != "PGDMP" ]; then
            echo "Not a PostgreSQL custom dump (PGDMP): ${DUMP}" >&2
            exit 1
          fi
          ls -lh "${DUMP}"
        env:
          GUDGAME_RESTORE_DUMP: ${{ secrets.GUDGAME_RESTORE_DUMP }}

      - name: Restore dump into gudgame_db
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          FORCE_RESTORE: ${{ inputs.force_restore }}
          SKIP_RESTORE_IF_DATA: ${{ inputs.skip_if_data }}
          GUDGAME_RESTORE_DUMP: ${{ secrets.GUDGAME_RESTORE_DUMP }}
        run: |
          set -euo pipefail
          chmod +x ops/db/restore-from-dump.sh
          if [ -n "${GUDGAME_RESTORE_DUMP:-}" ] && [ -f "${GUDGAME_RESTORE_DUMP}" ]; then
            export GUDGAME_RESTORE_DUMP
          else
            export GUDGAME_RESTORE_DUMP="$(pwd)/ops/db/backups/gudgame.dump"
          fi
          # Compose boolean env must be true/false strings
          export FORCE_RESTORE="${FORCE_RESTORE}"
          export SKIP_RESTORE_IF_DATA="${SKIP_RESTORE_IF_DATA}"
          docker compose --profile restore run --rm db-restore

      - name: Run migrations after restore
        if: ${{ inputs.run_migrate_after }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          DB_SCRIPT_MODE: "true"
        run: |
          docker compose --profile migrate build db-migrate
          docker compose --profile migrate run --rm -e DATABASE_URL -e DB_SCRIPT_MODE=true db-migrate

      - name: Recreate app containers
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ env.POSTGRESQL_DATABASE }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          STRICT_PRODUCTION_ENV: ${{ secrets.STRICT_PRODUCTION_ENV }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          AUTH_LOCKOUT_ENABLED: ${{ secrets.AUTH_LOCKOUT_ENABLED }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          STORAGE_ALLOW_LOCALHOST: ${{ secrets.STORAGE_ALLOW_LOCALHOST }}
          STORAGE_AUTH_MODE: ${{ secrets.STORAGE_AUTH_MODE }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          NEXT_PUBLIC_STORAGE_URL: ${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          USERNAME_STORAGE: ${{ secrets.USERNAME_STORAGE }}
          PASSWORD_STORAGE: ${{ secrets.PASSWORD_STORAGE }}
          XENDIT_STAGING_MODE: ${{ secrets.XENDIT_STAGING_MODE }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          XENDIT_XENPLATFORM_ENABLED: ${{ secrets.XENDIT_XENPLATFORM_ENABLED }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_EMBED_API_ENABLED: ${{ secrets.GOOGLE_MAPS_EMBED_API_ENABLED }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WIKI_SCRAPE_ALLOWED_HOSTS: ${{ secrets.WIKI_SCRAPE_ALLOWED_HOSTS }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
        run: |
          docker compose up -d --no-deps app
          docker compose up -d --wait --wait-timeout 120 --no-deps payout-cron || docker compose up -d --no-deps payout-cron
