events {
    worker_connections 1024;
}

http {
    # High-res racket / court photos + partner assets
    client_max_body_size 20M;

    upstream seaweedfs_filer {
        server seaweedfs:8333;
    }

    upstream seaweedfs_master {
        server seaweedfs:9333;
    }

    # Gateway for Filer UI & API (Port 8333)
    server {
        listen 8333;
        server_name localhost;

        location / {
            auth_basic "Secure Storage - Filer API";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://seaweedfs_filer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Gateway for Master Dashboard (Port 9333)
    server {
        listen 9333;
        server_name localhost;

        location / {
            auth_basic "Secure Storage - Master Dashboard";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://seaweedfs_master;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
